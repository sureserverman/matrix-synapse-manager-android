name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Minimal default GITHUB_TOKEN scope; these jobs only read the repo and upload artifacts.
permissions:
  contents: read

jobs:
  lint-and-unit-tests:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew lint

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-results
          path: '**/build/reports/lint-results-*.html'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: '**/build/reports/tests/testDebugUnitTest/'

  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  reproducibility-check:
    name: Verify reproducible build
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: First build
        run: ./gradlew :app:assembleRelease

      - name: Save first APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk /tmp/first.apk

      - name: Clean
        run: ./gradlew clean

      - name: Second build
        run: ./gradlew :app:assembleRelease

      - name: Compare APKs
        run: |
          if diff /tmp/first.apk app/build/outputs/apk/release/app-release-unsigned.apk; then
            echo "BUILD IS REPRODUCIBLE: APKs are identical"
          else
            echo "BUILD IS NOT REPRODUCIBLE: APKs differ"
            ls -la /tmp/first.apk app/build/outputs/apk/release/app-release-unsigned.apk
            exit 1
          fi

      - name: Deep diff (on failure)
        if: failure()
        run: |
          sudo apt-get install -y diffoscope
          diffoscope /tmp/first.apk app/build/outputs/apk/release/app-release-unsigned.apk || true

  mas-tests:
    name: MAS / OAuth tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run MAS unit tests
        run: |
          ./gradlew \
            :core:network:testDebugUnitTest --tests "com.matrix.synapse.network.auth.*" \
            :feature:auth:testDebugUnitTest --tests "com.matrix.synapse.feature.auth.oauth.*" \
            :feature:auth:testDebugUnitTest --tests "com.matrix.synapse.feature.auth.domain.LoginStrategyResolverTest" \
            :feature:auth:testDebugUnitTest --tests "com.matrix.synapse.feature.auth.domain.LogoutUseCaseTest" \
            :feature:auth:testDebugUnitTest --tests "com.matrix.synapse.feature.auth.ui.LoginViewModelOAuthTest"

      - name: Upload MAS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mas-test-results
          path: '**/build/reports/tests/testDebugUnitTest/'

  instrumented-tests:
    name: Instrumented Tests (API 29)
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests
    # Instrumented tests require an emulator — run on push to main only to save CI minutes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a # v2.37.0
        with:
          api-level: 29
          arch: x86_64
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumented-test-results
          path: '**/build/reports/androidTests/connected/'
